name: Accessibility checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm ci
      - name: Build
        run: npm run build
      - name: Start server
        run: npx http-server .next --port 4000 &
      - name: Run Playwright axe checks
        run: npx playwright test accessibility.spec.ts --project=chromium
        env:
          PORT: 4000
